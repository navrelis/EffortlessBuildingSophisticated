# The JDK CI uses to RUN Gradle itself (independent of the compile toolchain, which foojay auto-provisions via
# settings.gradle). Read by .github/workflows/build.yml; defaults to 21 if this key is absent.
ci_gradle_jdk=21

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ForgeGradle 7: one output directory per source set (classes and resources), as the Forge dev runtime expects.
net.minecraftforge.gradle.merge-source-sets=true

# Shared mod metadata: ../gradle/shared.properties. This folder builds the Forge jar for Minecraft 1.21, which Forge 51
# needs its own jar for (see build.gradle); ../forge builds the Forge jar for 1.21.1.

# Minecraft version of this build (the shared minecraft_version is 1.21.1): mappings, Forge artifact, jar name
forge_minecraft_version=1.21
forge_minecraft_version_range=[1.21]

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.html (the only and last Forge for 1.21)
forge_version=51.0.33
forge_version_range=[51.0.33,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[51,)
