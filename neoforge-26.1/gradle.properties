# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata: ../gradle/shared.properties. This folder builds the NeoForge jar for Minecraft 26.1 and 26.1.1,
# which only ever had beta NeoForge builds (26.1.0.x-beta / 26.1.1.x-beta, before 26.1.2 renamed BlockEvent.BreakEvent)
# and older Sophisticated Backpacks/Core builds; ../neoforge builds the NeoForge jar for 26.1.2 (see README.md).

# Minecraft versions of this jar (the shared minecraft_version is 26.1.2): jar name and neoforge.mods.toml
neoforge_minecraft_version=26.1
neoforge_minecraft_version_range=[26.1,26.1.1]

# https://projects.neoforged.net/neoforged/neoforge : the newest (and last) builds for 26.1 and 26.1.1 are betas.
# This build compiles and runs against the 26.1 one; the 26.1.1 runs pass -Pneo_version=26.1.1.15-beta.
neo_version=26.1.0.19-beta
# The loader version range can only use the major version of FML as bounds.
neoforge_loader_version_range=[1,)
# Minimum NeoForge declared in neoforge.mods.toml: the build this jar was run on (26.1.1.15-beta is newer).
neoforge_version_range_min=26.1.0.19-beta
# No Parchment: Minecraft ships unobfuscated with its parameter names since 26.1.

# Sophisticated Core/Backpacks (official NeoForge builds, Modrinth maven), compile-time and dev-runtime. Backpacks
# 3.25.48 is the newest 26.1 build that can load: 3.25.49 to 3.25.51 require Core 1.4.28, which was never released.
# Core 1.4.26 is the newest that runs on the NeoForge betas: 1.4.27 (tagged 26.1 and 26.1.2) calls
# StackCopySlot(int, int, int), which only NeoForge 26.1.2 has, and crashes the server when a backpack is opened.
sophisticatedcore_version=26.1-1.4.26.1688
sophisticatedbackpacks_version=26.1-3.25.48.1681
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper); tagged 26.1 to 26.1.2.
curios_version=15.0.0+26.1.2
ci_gradle_jdk=25
