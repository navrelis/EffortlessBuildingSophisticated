# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata: ../gradle/shared.properties. This folder builds the Forge jar for Minecraft 1.19 and 1.19.1: the
# Sophisticated Backpacks/Core builds for those versions have an older API than the 1.19.2 ones ../forge compiles
# against (see build.gradle and README.md).

# Minecraft version of this build (the shared minecraft_version is 1.19.2): Forge artifact, jar name
forge_minecraft_version=1.19
# Run on Forge 41.1.0 (Minecraft 1.19) and Forge 42.0.9 (Minecraft 1.19.1), see TESTING.md
forge_minecraft_version_range=[1.19,1.19.1]

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.19.html: compiled against and run on Forge 41.1.0,
# the latest Forge for 1.19 (also run on 42.0.9, the latest for 1.19.1). The mod accepts that build and every later
# one of both lines (forge_version_range, the oldest version this code was run on).
forge_version=41.1.0
forge_version_range=[41.1.0,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[41,)

# Sophisticated Core/Backpacks, official Forge builds for Minecraft 1.19 (their latest release, also the one for
# 1.19.1), resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>".
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core (618298)
#            file 3901972 = sophisticatedcore-1.19-0.4.10.87.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 3903449 = sophisticatedbackpacks-1.19-3.18.9.661.jar
sophisticatedcore_cf=sophisticated-core-618298:3901972
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:3903449
# Optional-dependency ranges in mods.toml: the Sophisticated Backpacks/Core builds this jar was run with and every later
# one of the 1.19 line (the 1.19.2 builds need ../forge's jar)
sophisticatedbackpacks_version_range=[1.19-3.18.9.661,1.19.2)
sophisticatedcore_version_range=[1.19-0.4.10.87,1.19.2)
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper). The 1.19.2 build, also released
# for 1.19 and 1.19.1.
curios_version=1.19.2-5.1.6.4
ci_gradle_jdk=21
