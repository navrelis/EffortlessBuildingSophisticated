# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata: ../gradle/shared.properties. This folder builds the Forge jar for Minecraft 1.18, which needs its
# own jar (see build.gradle and README.md): ../forge builds the Forge jar for 1.18.1.

# Minecraft version of this build (the shared minecraft_version is 1.18.1): Forge artifact, jar name, mods.toml
forge_minecraft_version=1.18
forge_minecraft_version_range=[1.18]

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.18.html
# Compiled against and run on Forge 38.0.17, the latest Forge for 1.18. The mod accepts that build and every later
# Forge 38 build (forge_version_range, the oldest version this code was run on).
forge_version=38.0.17
forge_version_range=[38.0.17,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[38,)
# No Parchment mappings exist for Minecraft 1.18 (they start at 1.18.1): official names without parameter names.

# Sophisticated Backpacks, official Forge build for Minecraft 1.18 (its latest 1.18 release), resolved through
# CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". This build still keeps the code later split off into
# Sophisticated Core under net.p3pp3rf1y.sophisticatedbackpacks (no sophisticatedcore package or mod). Compile-time and
# dev-runtime use the same version.
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 3555237 = sophisticatedbackpacks-1.18-3.12.1.433.jar
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:3555237
# Curios API (fallback scan of worn backpacks, see CuriosCompatHelper; in the smoke runtime for sb.worn_backpack).
# The last Curios built for 1.18 (the later ones are 1.18.1 builds): https://www.curseforge.com/minecraft/mc-mods/curios
# (309927), file 3567289 = curios-forge-1.18-5.0.2.5.jar
curios_cf=curios-309927:3567289
ci_gradle_jdk=21
