# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false
# Architectury Loom builds the Forge jar (see ../forge/build.gradle)
loom.platform=forge

# Shared mod metadata: ../gradle/shared.properties. This folder builds the Forge jar for Minecraft 1.16.4, which needs its
# own jar (see build.gradle and README.md): ../forge builds the Forge jar for 1.16.5.

# Minecraft version of this build (the shared minecraft_version is 1.16.5): Minecraft and Forge artifacts, jar name,
# mods.toml
forge_minecraft_version=1.16.4
forge_minecraft_version_range=[1.16.4]

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.16.4.html
# Compiled against and run on Forge 35.1.37, the latest Forge for 1.16.4. The mod accepts that build and every later
# Forge 35 build (forge_version_range, the oldest version this code was run on).
forge_version=35.1.37
forge_version_range=[35.1.37,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[35,)

# Sophisticated Backpacks, official Forge build for Minecraft 1.16.4 (its latest 1.16.4 release), resolved through
# CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". No Sophisticated Core, as on 1.16.5; its API differs from the
# 1.16.5 build in the backpack scan and the Tool Swapper (see build.gradle). Compile-time and dev-runtime use the same
# version.
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 3399778 = sophisticatedbackpacks-1.16.4-3.0.0.289.jar (mod version 1.16.4-3.0.0.289)
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:3399778
# Optional-dependency range in mods.toml: this build and any later 1.16.4 build; the 1.16.5 builds have the other API
# and need the ../forge jar
sophisticatedbackpacks_version_range=[1.16.4-3.0.0.289,1.16.5)
# Curios API (fallback scan of worn backpacks, see CuriosCompatHelper; in the smoke runtime for sb.worn_backpack).
# The same build as ../forge: https://modrinth.com/mod/curios version 1.16.5-4.1.0.0 (curios-forge-1.16.5-4.1.0.0.jar),
# declared for 1.16.4 and 1.16.5.
curios_modrinth=1.16.5-4.1.0.0
ci_gradle_jdk=21
