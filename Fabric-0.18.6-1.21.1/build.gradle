plugins {
    id 'fabric-loom' version '1.10.1'
    id 'maven-publish'
    id 'java-library'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()

    maven {
        // Registrate and Flywheel maven
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com'
    }
    maven {
        // Ponder, Flywheel, Catnip
        url = "https://maven.createmod.net"
    }
    maven {
        // CurseMaven for optional Sophisticated Backpacks/Storage coordinates
        url = "https://www.cursemaven.com"
    }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Config API port needed by Ponder
    mavenLocal()
}

base {
    archivesName = "${mod_id}-fabric"
}

java {
    // Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Empty source set: used by clientExported run so Loom does not attach this project as a dev mod (only jars in run/mods).
// Without mirroring main's dependency classpaths, Loom would only put exportedStub's output on the game classpath and
// the JVM could not find net.fabricmc.devlaunchinjector.Main (and nothing else).
sourceSets {
    exportedStub {
        def main = sourceSets.main
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        runtimeClasspath -= main.output
    }
    // In-world tests of the server-side building rules (Fabric GameTest). Own fabric.mod.json with a
    // "fabric-gametest" entrypoint; only loaded by the gametest run, never packaged into the mod jar.
    gametest {
        def main = sourceSets.main
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
            vmArgs '-Dfabric.log.level=debug'
        }
        // Loads mods from DevInstance_Fabric/run/mods only (copy exported sophisticatedbuilding-fabric-*.jar there).
        clientExported {
            inherit client
            configName = 'Minecraft Client (exported jar)'
            runDir '../DevInstance_Fabric/run'
            source sourceSets.exportedStub
        }
        // Headless game test server: runs every @GameTest of src/gametest, writes a JUnit report and
        // exits non-zero if a required test fails. Run with: gradlew runGametest (not part of build).
        gametest {
            server()
            configName = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/junit.xml').get().asFile}"
            runDir 'build/gametest'
            source sourceSets.gametest
        }
    }
}

// build compiles the game tests (so they cannot rot) but never runs them; that is runGametest's job.
tasks.named('check') {
    dependsOn tasks.named('gametestClasses')
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

configurations.configureEach {
    // flywheel-fabric already bundles these classes; remapping both jars causes duplicate-class failures.
    exclude group: "dev.engine-room.flywheel", module: "flywheel-fabric-api-${flywheel_minecraft_version}"
}

def embedCreateDeps = (findProperty("embedCreateDeps") ?: "true").toBoolean()
def useLocalRuntimeMods = (findProperty("useLocalRuntimeMods") ?: "false").toBoolean()
def otherModsTree = fileTree("other_mods") {
    include "sophisticated*.jar"
}
// Sophisticated Core jar-in-jars several io.github.fabricators_of_create.porting_lib modules
// (META-INF/jars/*.jar: transfer, fluids, core, item_abilities, loot, level_events, render_types,
// model_loader, lazy_registration, conditions). Their types (e.g. ItemStackHandler,
// SlottedStackStorage) are part of Core's public API (InventoryHandler/UpgradeHandler extend them),
// and SophisticatedCore.onInitialize() itself needs porting_lib:fluids/transfer at runtime
// (registerHandlers -> BaseFlowingFluid$Source), so Fabric Loader throws NoClassDefFoundError and
// the dev server never starts without them. Loom 1.10.1 does not put a mod*-configuration
// dependency's nested jar-in-jar jars on the compile OR runtime classpath when the outer jar comes
// from CurseMaven rather than being built with Loom's own jar-in-jar tooling; it does extract+remap
// each nested jar into loom-cache as a side effect of processing the Core dependency above, so reuse
// those remapped copies here instead of pulling unverified separate Porting-Lib coordinates.
// mixinextras-fabric and energy are intentionally excluded: mixinextras is a mixin library already
// on the loader's classpath (adding it as a second mod risks duplicate mixin registration) and
// energy is already declared as its own modLocalRuntime above.
def portingLibJarInJarTree = fileTree(".gradle/loom-cache/remapped_mods") {
    include "**/transfer-3.1.0*.jar"
    include "**/fluids-3.1.0*.jar"
    include "**/core-3.1.0*.jar"
    include "**/item_abilities-3.1.0*.jar"
    include "**/loot-3.1.0*.jar"
    include "**/level_events-3.1.0*.jar"
    include "**/render_types-3.1.0*.jar"
    include "**/model_loader-3.1.0*.jar"
    include "**/lazy_registration-3.1.0*.jar"
    include "**/conditions-3.1.0*.jar"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    if (embedCreateDeps) {
        // Match NeoForge behavior by shipping required Create rendering stack with the mod jar.
        modImplementation(include("dev.engine-room.flywheel:flywheel-fabric-${flywheel_minecraft_version}:${flywheel_version}")) {
            transitive = false
        }
        modImplementation(include("net.createmod.ponder:ponder-fabric:${ponder_version}+mc${minecraft_version}"))
    } else {
        modCompileOnly("dev.engine-room.flywheel:flywheel-fabric-${flywheel_minecraft_version}:${flywheel_version}") {
            transitive = false
        }
        modCompileOnly "net.createmod.ponder:ponder-fabric:${ponder_version}+mc${minecraft_version}"
        modLocalRuntime("dev.engine-room.flywheel:flywheel-fabric-${flywheel_minecraft_version}:${flywheel_version}") {
            transitive = false
        }
        modLocalRuntime "net.createmod.ponder:ponder-fabric:${ponder_version}+mc${minecraft_version}"
    }
    modLocalRuntime "teamreborn:energy:4.1.0"

    // Sophisticated Core/Backpacks/Storage, unofficial Fabric ports for MC 1.21.1 (CurseMaven).
    // Coordinates are documented in gradle.properties (sophisticatedcore_cf etc.).
    modCompileOnly "curse.maven:${sophisticatedcore_cf}"
    modCompileOnly "curse.maven:${sophisticatedbackpacks_cf}"
    modCompileOnly "curse.maven:${sophisticatedstorage_cf}"

    if (useLocalRuntimeMods) {
        // Dev runtime from local jars placed in other_mods/ (production, intermediary-mapped).
        modLocalRuntime(otherModsTree)
    } else {
        modLocalRuntime "curse.maven:${sophisticatedcore_cf}"
        modLocalRuntime "curse.maven:${sophisticatedbackpacks_cf}"
        modLocalRuntime "curse.maven:${sophisticatedstorage_cf}"
    }
    if (!portingLibJarInJarTree.isEmpty()) {
        compileOnly(portingLibJarInJarTree)
        // These jars are already Loom-remapped (named mappings) copies pulled from
        // loom-cache/remapped_mods, so add them as plain localRuntime (not modLocalRuntime, which
        // would try to remap an already-remapped jar and fail with "Failed to remap N mods").
        // Fabric Loader still discovers them as real mods at runtime via their fabric.mod.json.
        localRuntime(portingLibJarInJarTree)
    }

    compileOnly "javax.annotation:javax.annotation-api:1.3.2"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // TODO: replace with Fabric Curios equivalent if needed (e.g., Trinkets).
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "fabric_loader_version", project.fabric_loader_version
    filteringCharset = 'UTF-8'

    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                fabric_loader_version: project.fabric_loader_version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_description: project.mod_description,
                mod_authors: project.mod_authors,
                mod_license: project.mod_license
        )
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = 21
}

tasks.test {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.jar {
    from('TEMPLATE_LICENSE.txt') {
        rename { 'LICENSE_sophisticatedbuilding.txt' }
    }
}
