# The smoke test harness mod (see TESTING.md). Only loaded by runSmokeClient / runSmokeServer, never packaged.
modLoader="javafml"
loaderVersion="[1,)"
license="LGPL-3.0-only"

[[mods]]
modId="sophisticatedbuilding_smoketest"
version="1.0.0"
displayName="Sophisticated Building Smoke Test"
description='''In-game smoke test harness of Sophisticated Building.'''

[[dependencies.sophisticatedbuilding_smoketest]]
    modId="sophisticatedbuilding"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Smoke client only: the game window is created without taking the focus (SmokeWindowMixin)
[[mixins]]
config="sophisticatedbuilding_smoketest.mixins.json"
