# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://projects.neoforged.net/neoforged/neoforge (latest for Minecraft 1.20.4)
neo_version=20.4.251
# The loader version range can only use the major version of FML as bounds.
neoforge_loader_version_range=[1,)
# Minimum NeoForge declared in mods.toml's "neoforge" dependency (see build.gradle generateModMetadata / the
# template). This is the oldest version this code was run on (the neo_version the dev runs use), not an assumption
# about the lowest that would work; neo_version above is only the version this build compiles/runs against.
neoforge_version_range_min=20.4.251
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.4
parchment_mappings_version=2024.04.14

# Sophisticated Core/Backpacks, official NeoForge builds for Minecraft 1.20.4 (their last 1.20.4 releases; not on
# the Modrinth maven), resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". Compile-time and
# dev-runtime use the same versions.
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core (618298)
#            file 5296142 = sophisticatedcore-1.20.4-0.6.21.608.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 5297718 = sophisticatedbackpacks-1.20.4-3.20.6.1051.jar
sophisticatedcore_cf=sophisticated-core-618298:5296142
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:5297718
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper). Latest 1.20.4 release.
curios_version=7.4.3+1.20.4
