# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://projects.neoforged.net/neoforged/neoforge
neo_version=21.5.98
# The loader version range can only use the major version of FML as bounds.
neoforge_loader_version_range=[1,)
# Minimum NeoForge declared in neoforge.mods.toml's "neoforge" dependency (see build.gradle
# generateModMetadata / the template). This is the version this code was run on, not an assumption about the
# lowest that would work; neo_version above is the version this build compiles/runs against.
neoforge_version_range_min=21.5.98
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.5
parchment_mappings_version=2025.06.15

# Sophisticated Core/Backpacks (official NeoForge builds, Modrinth maven), compile-time and dev-runtime. Both require
# NeoForge 21.5.0 or later, which neo_version satisfies.
sophisticatedcore_version=1.21.5-1.5.0.2338
sophisticatedbackpacks_version=1.21.5-3.27.2.2152
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper).
curios_version=11.0.1+1.21.5
ci_gradle_jdk=21
