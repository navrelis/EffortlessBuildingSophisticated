# The JDK CI uses to RUN Gradle itself (independent of the compile toolchain, which foojay auto-provisions via
# settings.gradle). Read by .github/workflows/build.yml; defaults to 21 if this key is absent.
ci_gradle_jdk=21

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.251
# The loader version range can only use the major version of FML as bounds.
neoforge_loader_version_range=[1,)
# Minimum NeoForge declared in neoforge.mods.toml's "neoforge" dependency (see build.gradle
# generateModMetadata / the template). This is the oldest version this code was run on (the previous release's
# neo_version pin), not an assumption about the lowest that would work; neo_version above is only the version
# this build compiles/runs against.
neoforge_version_range_min=21.1.217
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Sophisticated Core/Backpacks (official NeoForge builds, Modrinth maven). Compile-time and dev-runtime use the
# same (latest) versions: neo_version is now >= 21.1.229, the minimum these builds require, so the older
# dev-runtime pin previously needed here is gone. BackpackScanCompat still resolves runOnBackpacks by reflection
# for the Fabric-port builds used on the fabric/ side, which return void instead of boolean.
sophisticatedcore_version=1.21.1-1.5.1.2341
sophisticatedbackpacks_version=1.21.1-3.26.3.2158
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper).
curios_version=9.5.1+1.21.1
