plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

apply from: '../gradle/smoketest.gradle'

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    // Mojang ships Java 21 to end users in 1.21.11, so mods should target Java 21.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-game smoke test harness (runSmokeClient / runSmokeServer, see TESTING.md): loader-neutral scenarios from
    // ../common/src/smoketest and the Forge glue from src/smoketest. No Sophisticated Backpacks on Forge 1.21.11, so no
    // backpack fixture. Its own mod ("sophisticatedbuilding_smoketest", META-INF/mods.toml), loaded
    // only by the smoke runs (every classpath folder with a mods.toml is a mod in the Forge dev runtime); never packaged.
    smoketest {
        java.srcDir "${commonDir}/src/smoketest/java"
        resources.srcDir "${commonDir}/src/smoketest/resources"
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

minecraft {
    // Official Mojang names; Forge runs on them since 1.20.6, so the jar is not reobfuscated.
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // "REGISTRIES": log the firing of registry events.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            // Mixin reads its configs from the jar manifest (see jar below); the dev runs name them on the command line.
            args "--mixin.config=${mod_id}.mixins.json"
        }

        register('client') {
            // runSmokeClient (= runSmoketestClient): a real client creates a fresh superflat world, runs the client
            // scenarios, writes <smoketestOut>/smoketest-result.json and exits. gradlew runSmokeClient -PsmoketestOut=<dir>
            with(sourceSets.smoketest) {
                workingDir = layout.projectDirectory.dir('build/smoketest/client-run')
                systemProperty 'sophisticatedbuilding.smoketest.mode', 'client'
                systemProperty 'sophisticatedbuilding.smoketest.out', smoketestOutDir('client').absolutePath
                // Harness mixin (SmokeWindowMixin): the window is created without taking the focus
                args "--mixin.config=sophisticatedbuilding_smoketest.mixins.json"
            }
        }

        register('server') {
            args '--nogui'
        }

        // Launches the GameTestServer, runs all registered gametests, then exits.
        register('gameTestServer') {
            // runSmokeServer (= runSmoketestGameTestServer): headless, the game test server runs the server scenarios and
            // writes the same JSON. gradlew runSmokeServer -PsmoketestOut=<dir>
            with(sourceSets.smoketest) {
                workingDir = layout.projectDirectory.dir('build/smoketest/server-run')
                systemProperty 'sophisticatedbuilding.smoketest.mode', 'server'
                systemProperty 'sophisticatedbuilding.smoketest.out', smoketestOutDir('server').absolutePath
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

// The smoke harness compiles and runs against everything main does; ForgeGradle then also creates the smoketest
// variants of the runs (runSmoketestClient, runSmoketestGameTestServer, ...).
configurations {
    smoketestImplementation.extendsFrom implementation
}

dependencies {
    // The unit tests exercise vanilla types (BlockPos, ...): testImplementation extends implementation, so Minecraft
    // is on their classpath too.
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // Checks the EventBus 7 listeners (@SubscribeEvent) at compile time, as in the Forge 61 MDK.
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This block of code expands all declared replace properties in the specified resource targets (META-INF/mods.toml and
// pack.mcmeta; Forge ignores the resources of a mod without pack.mcmeta).
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range   : minecraft_version_range,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
// Include the output of "generateModMetadata" as an input directory for the build.
sourceSets.main.resources.srcDir generateModMetadata

// The smoke runs under the task names every loader build uses; they pass or fail on the result file they write (shared
// logic in ../gradle/smoketest.gradle)
tasks.matching { it.name == 'runSmoketestClient' }.configureEach {
    verifySmokeRun(it, smoketestOutDir('client'))
    disableEarlyWindow(it, file('build/smoketest/client-run'))
}
tasks.matching { it.name == 'runSmoketestGameTestServer' }.configureEach { verifySmokeRun(it, smoketestOutDir('server')) }
tasks.register('runSmokeClient') {
    group = 'Slime Launcher'
    description = 'Runs the client smoke test (runSmoketestClient).'
    dependsOn 'runSmoketestClient'
}
tasks.register('runSmokeServer') {
    group = 'Slime Launcher'
    description = 'Runs the server smoke test (runSmoketestGameTestServer).'
    dependsOn 'runSmoketestGameTestServer'
}

// merge-source-sets puts the classes and the resources of a source set into one directory, so compileJava and
// processResources have overlapping outputs. processResources is not incremental: before it runs, Gradle deletes its
// previous outputs, and after a compileJava restored from the build cache those can include the classes (the jar then
// had no classes). So processResources is not tracked (it always runs and never deletes anything; stale resources go
// with clean) and runs after the compile task of its source set.
sourceSets.configureEach { sourceSet ->
    tasks.named(sourceSet.processResourcesTaskName) {
        doNotTrackState('Shares its output directory with the compile task (merge-source-sets)')
        mustRunAfter tasks.named(sourceSet.compileJavaTaskName)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the smoke harness (so it cannot rot) but never runs it; that is runSmokeClient / runSmokeServer's job.
tasks.named('check') {
    dependsOn tasks.named('checkCommonIsLoaderNeutral'), tasks.named('smoketestClasses')
}

// Resolved while configuring: the configuration cache cannot read project properties at execution time.
def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    // The common mixin config (the GuiGraphics accessor of the GUI quads, Minecraft 1.21.6+).
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
