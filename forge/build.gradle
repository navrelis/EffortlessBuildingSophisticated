plugins {
    // Architectury Loom, not ForgeGradle: ForgeGradle's "official" mappings for Minecraft 1.16.5 keep the MCP class names
    // (net.minecraft.util.ResourceLocation, ...), while ../common is written against the Mojang class names that Fabric
    // 1.16.5 and every later Forge use. Architectury Loom maps Forge 1.16.5 to the full Mojang names and reobfuscates the
    // jar to SRG names (remapJar) for players.
    id 'dev.architectury.loom' version '1.17.493'
    id 'java-library'
    id 'idea'
}

apply from: '../gradle/smoketest.gradle'

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    // Minecraft 1.16.5 runs on Java 8 (Mojang ships Java 8 with it), so mods target Java 8.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-game smoke test harness (runSmokeClient / runSmokeServer, see TESTING.md): loader-neutral scenarios from
    // ../common/src/smoketest, the Sophisticated Backpacks fixture from ../common/src/smoketestBackpacks and the
    // Forge glue from src/smoketest. Its own mod ("sophisticatedbuilding_smoketest", META-INF/mods.toml), loaded only by
    // the smoke runs, never packaged into the mod jar.
    smoketest {
        java.srcDirs "${commonDir}/src/smoketest/java", "${commonDir}/src/smoketestBackpacks/java"
        resources.srcDirs "${commonDir}/src/smoketest/resources", "${commonDir}/src/smoketestBackpacks/resources"
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// mod* configurations of the smoke source set (Curios in its runtime only)
loom.createRemapConfigurations(sourceSets.smoketest)

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Sophisticated Backpacks (no separate Sophisticated Core on 1.16.5): compiled against, and present in the dev runs
    // (same version, see gradle.properties) so runClient/runServer start with the backpack integration active.
    // Optional for players.
    modCompileOnly "curse.maven:${sophisticatedbackpacks_cf}"
    modLocalRuntime "curse.maven:${sophisticatedbackpacks_cf}"
    modCompileOnly "maven.modrinth:curios:${curios_modrinth}"
    modSmoketestRuntimeOnly "maven.modrinth:curios:${curios_modrinth}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// FML's MOD_CLASSES for a run: which resource and class directories form which mod (resources first: FML reads
// META-INF/mods.toml from the first directory of a mod). The smoke runs list the harness mod next to the mod itself;
// every other run gets Loom's value (only the mod, from loom.mods below).
def modClasses = { Map<String, SourceSet> mods ->
    mods.collectMany { name, sourceSet ->
        ([sourceSet.output.resourcesDir] + sourceSet.output.classesDirs.files).collect { "${name}%%${it.absolutePath}" }
    }.join(File.pathSeparator)
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArg '--nogui'
        }
        // Smoke test harness (see TESTING.md): a real client creates a fresh superflat world, runs the client
        // scenarios, writes <smoketestOut>/smoketest-result.json and exits. gradlew runSmokeClient -PsmoketestOut=<dir>
        smokeClient {
            client()
            configName = 'Smoke Test Client'
            runDir 'build/smoketest/client-run'
            source sourceSets.smoketest
            vmArg '-Dsophisticatedbuilding.smoketest.mode=client'
            environmentVariable 'MOD_CLASSES', modClasses([(mod_id): sourceSets.main, sophisticatedbuilding_smoketest: sourceSets.smoketest])
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('client')}"
        }
        // Headless: a dedicated server on a fresh superflat world runs the server scenarios (Minecraft 1.16.5 has no
        // game test framework, see ServerTestRunner) and writes the same JSON. gradlew runSmokeServer -PsmoketestOut=<dir>
        smokeServer {
            server()
            configName = 'Smoke Test Server'
            runDir 'build/smoketest/server-run'
            programArg '--nogui'
            source sourceSets.smoketest
            vmArg '-Dsophisticatedbuilding.smoketest.mode=server'
            environmentVariable 'MOD_CLASSES', modClasses([(mod_id): sourceSets.main, sophisticatedbuilding_smoketest: sourceSets.smoketest])
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('server')}"
        }
    }
}

// The smoke runs pass or fail on the result file they write (shared logic in ../gradle/smoketest.gradle)
tasks.named('runSmokeClient') { verifySmokeRun(it, smoketestOutDir('client')) }
tasks.named('runSmokeServer') { verifySmokeRun(it, smoketestOutDir('server')) }
// The smoke server is a plain dedicated server: every run starts on a fresh superflat world on its own port (other dev
// servers may run at the same time), with the EULA of this dev-only server accepted.
def smokeServerDir = file('build/smoketest/server-run')
tasks.named('runSmokeServer') {
    doFirst {
        new File(smokeServerDir, 'world').deleteDir()
        smokeServerDir.mkdirs()
        // The level type without namespace ("minecraft:flat" silently falls back to normal terrain) and no
        // generator-settings: the server then uses the default superflat layers (bedrock, 2 dirt, grass), which are the
        // ones the other branches write here.
        new File(smokeServerDir, 'server.properties').text = 'level-type=flat\n' +
                'server-port=25731\n'
        new File(smokeServerDir, 'eula.txt').text = 'eula=true\n'
    }
}

// This block of code expands all declared replace properties in the specified resource targets (META-INF/mods.toml and
// pack.mcmeta; Forge ignores the resources of a mod without pack.mcmeta).
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range   : minecraft_version_range,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
// Include the output of "generateModMetadata" as an input directory for the build.
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // No options.release: the Java 8 toolchain compiles with JDK 8's javac, which has no --release flag (JDK 9+).
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the smoke harness (so it cannot rot) but never runs it; that is runSmokeClient / runSmokeServer's job.
tasks.named('check') {
    dependsOn tasks.named('checkCommonIsLoaderNeutral'), tasks.named('smoketestClasses')
}

// Resolved while configuring
def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
