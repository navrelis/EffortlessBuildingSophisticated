plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply from: '../gradle/smoketest.gradle'

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    // Mojang ships Java 17 to end users in 1.20.4, so mods should target Java 17.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-game smoke test harness (runSmokeClient / runSmokeServer, see TESTING.md): loader-neutral scenarios from
    // ../common/src/smoketest and the Forge glue from src/smoketest. No Sophisticated Backpacks on Forge 1.20.4, so no
    // backpack fixture. Its own mod ("sophisticatedbuilding_smoketest", META-INF/mods.toml), loaded only by the smoke
    // runs (the only runs that list it in their mods); never packaged.
    smoketest {
        java.srcDir "${commonDir}/src/smoketest/java"
        resources.srcDir "${commonDir}/src/smoketest/resources"
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

// The smoke harness compiles and runs against everything main does.
configurations {
    smoketestImplementation.extendsFrom implementation
}

minecraft {
    // Official Mojang names in the dev environment; Forge 1.20.4 runs on SRG names, so the jar is reobfuscated
    // (reobfJar, see below).
    mappings channel: 'official', version: minecraft_version

    // Runs Gradle's processResources on the IDE output folders before an IDE run starts.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            // "REGISTRIES": log the firing of registry events.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        // Launches the GameTestServer, runs all registered gametests, then exits.
        gameTestServer {
        }

        // runSmokeClient: a real client creates a fresh superflat world, runs the client scenarios, writes
        // <smoketestOut>/smoketest-result.json and exits. gradlew runSmokeClient -PsmoketestOut=<dir>
        smokeClient {
            parent runs.client
            workingDirectory project.file('build/smoketest/client-run')
            property 'sophisticatedbuilding.smoketest.mode', 'client'
            property 'sophisticatedbuilding.smoketest.out', smoketestOutDir('client').absolutePath
            // Harness mixin (SmokeWindowMixin): the window is created without taking the focus
            args '--mixin.config=sophisticatedbuilding_smoketest.mixins.json'
            mods {
                sophisticatedbuilding_smoketest {
                    source sourceSets.smoketest
                }
            }
        }

        // runSmokeServer: headless, Forge's game test server runs the server scenarios and writes the same JSON.
        // gradlew runSmokeServer -PsmoketestOut=<dir>
        smokeServer {
            parent runs.gameTestServer
            workingDirectory project.file('build/smoketest/server-run')
            property 'sophisticatedbuilding.smoketest.mode', 'server'
            property 'sophisticatedbuilding.smoketest.out', smoketestOutDir('server').absolutePath
            mods {
                sophisticatedbuilding_smoketest {
                    source sourceSets.smoketest
                }
            }
        }
    }
}

// The smoke runs pass or fail on the result file they write (shared logic in ../gradle/smoketest.gradle)
tasks.matching { it.name == 'runSmokeClient' }.configureEach {
    verifySmokeRun(it, smoketestOutDir('client'))
    disableEarlyWindow(it, file('build/smoketest/client-run'))
}
tasks.matching { it.name == 'runSmokeServer' }.configureEach { verifySmokeRun(it, smoketestOutDir('server')) }
// Forge 49's game test server creates its world from server.properties (default: normal terrain), so the test
// structures at y -60 sat in caves and aquifers (water once flowed into server.merge_undo_refund's snow position).
// Every run starts on a fresh superflat world, like the vanilla game test server on the other loaders (and as on
// mc/1.20.1 Forge).
def smokeServerDir = file('build/smoketest/server-run')
tasks.matching { it.name == 'runSmokeServer' }.configureEach {
    doFirst {
        new File(smokeServerDir, 'world').deleteDir()
        smokeServerDir.mkdirs()
        // The vanilla default superflat layers (without them the server logs an ERROR and uses the same default)
        new File(smokeServerDir, 'server.properties').text = 'level-type=minecraft\\:flat\n' +
                'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},' +
                '{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\n'
    }
}

dependencies {
    // The unit tests exercise vanilla types (BlockPos, ...): testImplementation extends implementation, so Minecraft
    // is on their classpath too.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// This block of code expands all declared replace properties in the specified resource targets (META-INF/mods.toml and
// pack.mcmeta; Forge ignores the resources of a mod without pack.mcmeta).
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range   : minecraft_version_range,
            forge_version_range       : forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_license               : mod_license,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_description           : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
// Include the output of "generateModMetadata" as an input directory for the build.
sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the smoke harness (so it cannot rot) but never runs it; that is runSmokeClient / runSmokeServer's job.
tasks.named('check') {
    dependsOn tasks.named('checkCommonIsLoaderNeutral'), tasks.named('smoketestClasses')
}

def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
    // Forge 1.20.4 runs on SRG names: reobfJar remaps build/libs/<name>.jar in place, so the released jar is the
    // reobfuscated one.
    finalizedBy 'reobfJar'
}

// ForgeGradle's dev runtime expects one output directory per source set (classes and resources together); otherwise
// the mod's classes and resources end up in two different modules.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// So compileJava and processResources have overlapping outputs. processResources is not incremental: before it runs,
// Gradle deletes its previous outputs, and after a compileJava restored from the build cache those can include the
// classes (the smoke harness then compiled against a main output without classes). So processResources is not tracked
// (it always runs and never deletes anything; stale resources go with clean) and runs after the compile task of its
// source set. Same change as on mc/1.21.1 and mc/1.21.4.
sourceSets.configureEach { sourceSet ->
    tasks.named(sourceSet.processResourcesTaskName) {
        doNotTrackState('Shares its output directory with the compile task')
        mustRunAfter tasks.named(sourceSet.compileJavaTaskName)
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
