# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.18.2.html
# Compiled against and run on Forge 40.3.12, the latest Forge for 1.18.2. The mod accepts that build and every later
# Forge 40 build (forge_version_range, the oldest version this code was run on).
forge_version=40.3.12
forge_version_range=[40.3.12,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[40,)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.18.2
parchment_mappings_version=2022.11.06

# Sophisticated Core/Backpacks, official Forge builds for Minecraft 1.18.2 (their latest 1.18.2 releases), resolved
# through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". Compile-time and dev-runtime use the same versions.
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core (618298)
#            file 5296312 = sophisticatedcore-1.18.2-0.6.4.604.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 5654080 = sophisticatedbackpacks-1.18.2-3.20.3.1063.jar
sophisticatedcore_cf=sophisticated-core-618298:5296312
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:5654080
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper). Latest 1.18.2 release.
curios_version=1.18.2-5.0.9.2
ci_gradle_jdk=21
