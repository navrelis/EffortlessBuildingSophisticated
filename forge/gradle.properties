# The JDK CI uses to RUN Gradle itself (independent of the compile toolchain, which foojay auto-provisions via
# settings.gradle). Read by .github/workflows/build.yml; defaults to 21 if this key is absent.
ci_gradle_jdk=21

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 6 does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.4.html
# Compiled against and run on the latest Forge for 1.20.4; the mod accepts that build and every later Forge 49 build
# (forge_version_range, the oldest version this code was run on).
forge_version=49.2.9
forge_version_range=[49.2.9,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[49,)
