# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.18.1.html
# Compiled against and run on Forge 39.1.2, the latest (and recommended) Forge for 1.18.1. The mod accepts that build
# and every later Forge 39 build (forge_version_range, the oldest version this code was run on).
forge_version=39.1.2
forge_version_range=[39.1.2,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[39,)
# Minecraft range of the Forge jar (replaces minecraft_version_range of ../gradle/shared.properties): Forge 39 exists
# only for 1.18.1; Forge 38 (1.18) and its Sophisticated Backpacks build were not verified with this jar (TESTING.md).
forge_minecraft_version_range=[1.18.1]
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.18.1
parchment_mappings_version=2022.03.06

# Sophisticated Backpacks, official Forge build for Minecraft 1.18.1 (its latest 1.18.1 release), resolved through
# CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". On 1.18.1 Sophisticated Core is not a separate download yet:
# this one jar holds both mods (sophisticatedbackpacks and sophisticatedcore, packages net.p3pp3rf1y.sophisticatedcore
# and net.p3pp3rf1y.sophisticatedbackpacks). Compile-time and dev-runtime use the same version.
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 3693291 = sophisticatedbackpacks-1.18.1-3.15.15.550.jar
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:3693291
# Curios API (fallback scan of worn backpacks, see CuriosCompatHelper; in the smoke runtime for sb.worn_backpack).
# Latest 1.18.1 release, CurseForge only (no Modrinth build for 1.18.1):
#            https://www.curseforge.com/minecraft/mc-mods/curios (309927), file 3661868 = curios-forge-1.18.1-5.0.6.2.jar
curios_cf=curios-309927:3661868
ci_gradle_jdk=21
