# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.19.2.html
# Compiled against and run on Forge 43.5.2, the latest Forge for 1.19.2. The mod accepts that build and every later
# Forge 43 build (forge_version_range, the oldest version this code was run on).
forge_version=43.5.2
# The Minecraft versions of this jar (overrides minecraft_version_range of ../gradle/shared.properties): it needs the
# Sophisticated Backpacks/Core builds of 1.19.2 (forge-1.19/ builds the jar for 1.19 and 1.19.1).
forge_minecraft_version_range=[1.19.2]
forge_version_range=[43.5.2,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[43,)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.19.2
parchment_mappings_version=2022.11.27

# Sophisticated Core/Backpacks, official Forge builds for Minecraft 1.19.2 (their latest 1.19.2 releases), resolved
# through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". Compile-time and dev-runtime use the same versions.
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core (618298)
#            file 5870031 = sophisticatedcore-1.19.2-0.6.4.730.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 5194759 = sophisticatedbackpacks-1.19.2-3.20.2.1035.jar
sophisticatedcore_cf=sophisticated-core-618298:5870031
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:5194759
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper). Latest 1.19.2 release.
curios_version=1.19.2-5.1.6.4
ci_gradle_jdk=21
