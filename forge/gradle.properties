# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ForgeGradle 7: one output directory per source set (classes and resources), as the Forge dev runtime expects.
net.minecraftforge.gradle.merge-source-sets=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_26.2.html
# Compiled against and run on 65.1.3, the latest 26.2 build; the mod accepts that build and every
# later Forge 65 build (forge_version_range).
forge_version=65.1.3
forge_version_range=[65.1.3,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[65,)
# Minecraft version declared in mods.toml: exactly 26.2, the only version this jar was run on.
forge_minecraft_version_range=[26.2]
ci_gradle_jdk=25
