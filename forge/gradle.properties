# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.17.1.html
# Compiled against and run on Forge 37.1.1, the latest (and recommended) Forge for 1.17.1. The mod accepts that build
# and every later Forge 37 build (forge_version_range, the oldest version this code was run on).
forge_version=37.1.1
forge_version_range=[37.1.1,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[37,)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.17.1
parchment_mappings_version=2021.12.12

# Sophisticated Backpacks, official Forge build for Minecraft 1.17.1 (its latest 1.17.1 release), resolved through
# CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". On 1.17.1 there is no Sophisticated Core: the backpack
# framework (upgrades, upgrade containers, settings tabs) lives in the sophisticatedbackpacks mod itself
# (package net.p3pp3rf1y.sophisticatedbackpacks). Compile-time and dev-runtime use the same version.
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 3594054 = sophisticatedbackpacks-1.17.1-3.12.3.496.jar
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:3594054
# Curios API (fallback scan of worn backpacks, see CuriosCompatHelper; in the smoke runtime for sb.worn_backpack).
# Latest 1.17.1 release, CurseForge only (no Modrinth build for 1.17.1):
#            https://www.curseforge.com/minecraft/mc-mods/curios (309927), file 3607708 = curios-forge-1.17.1-5.0.2.7.jar
curios_cf=curios-309927:3607708
ci_gradle_jdk=21
