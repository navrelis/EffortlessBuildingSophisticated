# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ForgeGradle 7: one output directory per source set (classes and resources), as the Forge dev runtime expects.
net.minecraftforge.gradle.merge-source-sets=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.5.html
# Compiled against the oldest build with the API the mod needs (55.0.24 added AddGuiOverlayLayersEvent, used for the
# HUD overlays; the world previews need no Forge API, a mixin adds their frame pass); the mod accepts that build and
# every later Forge 55 build (forge_version_range). Also run on 55.1.14, the latest 1.21.5 build.
forge_version=55.0.24
forge_version_range=[55.0.24,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[55,)
ci_gradle_jdk=21
