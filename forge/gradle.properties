# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ForgeGradle 7: one output directory per source set (classes and resources), as the Forge dev runtime expects.
net.minecraftforge.gradle.merge-source-sets=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.4.html
# Compiled against the oldest build with the API the mod needs (54.1.4 added AddFramePassEvent, used for the world
# previews; 54.1.5 added AddGuiOverlayLayersEvent, used for the HUD overlays); the mod accepts that build and every
# later Forge 54 build (forge_version_range). Also run on 54.1.18, the latest 1.21.4 build.
forge_version=54.1.5
forge_version_range=[54.1.5,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[54,)
