# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.19.4.html
# Compiled against and run on Forge 45.4.5, the latest Forge for 1.19.4. The mod accepts that build and every later
# Forge 45 build (forge_version_range, the oldest version this code was run on).
forge_version=45.4.5
# The Minecraft versions of this jar (overrides minecraft_version_range of ../gradle/shared.properties).
forge_minecraft_version_range=[1.19.4]
forge_version_range=[45.4.5,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[45,)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.19.4
parchment_mappings_version=2023.06.26

# No Sophisticated Backpacks for Forge 1.19.4 (the official builds skip 1.19.3 and 1.19.4): this build ships no
# backpack integration, and the Sophisticated Building Upgrade items stay placeholders.
ci_gradle_jdk=21
