# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
# Compiled against and run on Forge 47.1.3: NeoForge's 1.20.1 build is a fork of Forge 47.1 that loads Forge mods, so
# a jar built against 47.1.x runs on both. The mod accepts that build and every later Forge 47 build
# (forge_version_range, the oldest version this code was run on).
forge_version=47.1.3
forge_version_range=[47.1.3,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[47,)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Sophisticated Core/Backpacks, official Forge builds for Minecraft 1.20.1 (their latest 1.20.1 releases), resolved
# through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". Compile-time and dev-runtime use the same versions.
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core (618298)
#            file 8839328 = sophisticatedcore-1.20.1-1.5.1.2335.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 8845923 = sophisticatedbackpacks-1.20.1-3.26.3.2157.jar
sophisticatedcore_cf=sophisticated-core-618298:8839328
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:8845923
# Curios API, compile only (fallback scan of worn backpacks, see CuriosCompatHelper). Latest 1.20.1 release.
curios_version=5.14.1+1.20.1
ci_gradle_jdk=21
