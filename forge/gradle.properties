# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false
# Architectury Loom builds the Forge jar (see build.gradle)
loom.platform=forge

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.16.5.html
# Compiled against and run on Forge 36.2.42, the latest Forge for 1.16.5. The mod accepts that build and every later
# Forge 36 build (forge_version_range, the oldest version this code was run on).
forge_version=36.2.42
forge_version_range=[36.2.42,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[36,)

# Sophisticated Backpacks, official Forge build for Minecraft 1.16.5 (its latest 1.16.5 release), resolved through
# CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". On 1.16.5 there is no Sophisticated Core: the backpack
# framework (upgrades, upgrade containers, settings tabs) lives in the sophisticatedbackpacks mod itself
# (package net.p3pp3rf1y.sophisticatedbackpacks). Compile-time and dev-runtime use the same version.
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 4167327 = sophisticatedbackpacks-1.16.5-3.15.20.755.jar
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:4167327
# Curios API (fallback scan of worn backpacks, see CuriosCompatHelper; in the smoke runtime for sb.worn_backpack).
# Latest 1.16.5 release, from Modrinth (https://modrinth.com/mod/curios, version 1.16.5-4.1.0.0 =
# curios-forge-1.16.5-4.1.0.0.jar, declared for 1.16.4 and 1.16.5).
curios_modrinth=1.16.5-4.1.0.0
ci_gradle_jdk=21
