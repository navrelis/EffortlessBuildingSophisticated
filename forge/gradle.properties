# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false
# Architectury Loom builds the Forge jar (see build.gradle)
loom.platform=forge

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.16.3.html
# Compiled against and run on Forge 34.1.42, the latest Forge for 1.16.3. The mod accepts that build and every later
# Forge 34 build (forge_version_range, the oldest version this code was run on).
forge_version=34.1.42
forge_version_range=[34.1.42,)
# Minecraft range of the Forge jar (replaces minecraft_version_range of ../gradle/shared.properties, as on mc/1.16.5):
# Forge 34 exists only for 1.16.3, the only version this jar was run on.
forge_minecraft_version_range=[1.16.3]
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[34,)

# Sophisticated Backpacks, official Forge build for Minecraft 1.16.3 (its latest 1.16.3 release, one of SB's first
# releases), resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>". There is no Sophisticated Core:
# the backpack framework (upgrades, upgrade containers, settings tabs) lives in the sophisticatedbackpacks mod itself
# (package net.p3pp3rf1y.sophisticatedbackpacks). Compile-time and dev-runtime use the same version.
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks (422301)
#            file 3142665 = sophisticatedbackpacks-1.16.4-1.0.0.94.jar (tagged for Minecraft 1.16.3 on CurseForge,
#            mod version "1.16.4-1.0.0.94")
sophisticatedbackpacks_cf=sophisticated-backpacks-422301:3142665
# Curios API (fallback scan of worn backpacks, see CuriosCompatHelper; in the smoke runtime for sb.worn_backpack).
# Latest release tagged for 1.16.3 (no 1.16.3 build on Modrinth), from CurseForge (309927):
#            file 3122651 = curios-forge-1.16.4-4.0.3.0.jar (tagged for 1.16.3 and 1.16.4)
curios_cf=curios-309927:3122651
ci_gradle_jdk=21
