# The JDK CI uses to RUN Gradle itself (independent of the compile toolchain, which foojay auto-provisions via
# settings.gradle). Read by .github/workflows/build.yml; defaults to 21 if this key is absent.
ci_gradle_jdk=21

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ForgeGradle 7: one output directory per source set (classes and resources), as the Forge dev runtime expects.
net.minecraftforge.gradle.merge-source-sets=true

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.1.html
# Compiled against the oldest build with the API the mod needs (52.1.2 added AddGuiOverlayLayersEvent, used for the
# HUD overlays); the mod accepts that build and every later Forge 52 build (forge_version_range).
forge_version=52.1.2
forge_version_range=[52.1.2,)
# The loader version range can only use the major version of Forge (the javafml language provider) as bounds.
forge_loader_version_range=[52,)
