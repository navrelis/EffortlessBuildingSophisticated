plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java-library'
    id 'idea'
}

apply from: '../gradle/smoketest.gradle'

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    // Mojang ships Java 25 to end users since 26.1, so mods should target Java 25.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-world tests of the server-side building rules (Fabric GameTest). Own fabric.mod.json with a
    // "fabric-gametest" entrypoint; only loaded by the gametest run, never packaged into the mod jar.
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // In-game smoke test harness (runSmokeClient / runSmokeServer, see TESTING.md): loader-neutral scenarios from
    // ../common/src/smoketest and the Fabric glue from src/smoketest. No Sophisticated Backpacks on Fabric 26.2, so no
    // backpack fixture (../common/src/smoketestBackpacks) and no Trinkets. Own fabric.mod.json (mod
    // "sophisticatedbuilding_smoketest"); only loaded by the smoke runs, never packaged into the mod jar.
    smoketest {
        java.srcDir "${commonDir}/src/smoketest/java"
        resources.srcDir "${commonDir}/src/smoketest/resources"
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // Empty source set of the clientExported run: Minecraft and Fabric Loader only, so every mod (this one included)
    // comes from run-exported/mods. This project and Fabric API (resolved lazily) are left out.
    exportedStub {
        def excluded = main.output + files({
            configurations.detachedConfiguration(dependencies.create("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"))
        })
        runtimeClasspath = main.runtimeClasspath.filter { file -> file.name.startsWith('fabric-loader-') || !excluded.contains(file) }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Minecraft is unobfuscated since 26.1: no mappings, plain dependencies, no remapping (the mod jar is built by jar)
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    // Keep the dev Minecraft jar free of the interfaces other mods inject (Fabric API): the code
    // does not use them, and without them the clientExported run works with whatever set of mods is in its folder.
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
    runs {
        client {
            client()
        }
        server {
            server()
            vmArgs '-Dfabric.log.level=debug'
        }
        // Client that loads only the jars in run-exported/mods (production jars, e.g. an exported build of this mod
        // and Fabric API); nothing from this project or its dev dependencies.
        clientExported {
            client()
            configName = 'Minecraft Client (exported jars)'
            runDir 'run-exported'
            source sourceSets.exportedStub
        }
        // Headless game test server: runs every @GameTest of src/gametest, writes a JUnit report and
        // exits non-zero if a required test fails. Run with: gradlew runGametest (not part of build).
        gametest {
            server()
            configName = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/junit.xml').get().asFile}"
            runDir 'build/gametest'
            source sourceSets.gametest
        }
        // Smoke test harness (see TESTING.md): a real client creates a fresh superflat world, runs the client
        // scenarios, writes <smoketestOut>/smoketest-result.json and exits. gradlew runSmokeClient -PsmoketestOut=<dir>
        smokeClient {
            client()
            configName = 'Smoke Test Client'
            runDir 'build/smoketest/client-run'
            source sourceSets.smoketest
            vmArg '-Dsophisticatedbuilding.smoketest.mode=client'
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('client')}"
        }
        // Headless: a game test server runs the server scenarios (fake survival players) and writes the same JSON.
        // gradlew runSmokeServer -PsmoketestOut=<dir>
        smokeServer {
            server()
            configName = 'Smoke Test Server'
            runDir 'build/smoketest/server-run'
            source sourceSets.smoketest
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dsophisticatedbuilding.smoketest.mode=server'
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('server')}"
        }
    }
}

// The smoke runs pass or fail on the result file they write (shared logic in ../gradle/smoketest.gradle)
tasks.named('runSmokeClient') { verifySmokeRun(it, smoketestOutDir('client')) }
tasks.named('runSmokeServer') { verifySmokeRun(it, smoketestOutDir('server')) }

processResources {
    var expandProps = [
            version                  : project.version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_description          : mod_description,
            mod_authors              : mod_authors,
            mod_license              : mod_license,
            minecraft_version        : minecraft_version,
            fabric_loader_version_min: fabric_loader_version_min,
            fabric_api_version_min   : fabric_api_version_min,
            java_version             : java_version
    ]
    inputs.properties expandProps
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the game tests and the smoke harness (so they cannot rot) but never runs them; that is the job of
// runGametest and runSmokeClient / runSmokeServer.
tasks.named('check') {
    dependsOn tasks.named('gametestClasses'), tasks.named('smoketestClasses'), tasks.named('checkCommonIsLoaderNeutral')
}

// Resolved while configuring: the configuration cache cannot read project properties at execution time.
def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
