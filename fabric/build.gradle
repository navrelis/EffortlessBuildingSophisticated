plugins {
    id 'fabric-loom' version '1.17.21'
    id 'java-library'
    id 'idea'
}

apply from: '../gradle/smoketest.gradle'

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    // Mojang ships Java 17 to end users in 1.19.2, so mods should target Java 17.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-world tests of the server-side building rules (Fabric GameTest). Own fabric.mod.json with a
    // "fabric-gametest" entrypoint; only loaded by the gametest run, never packaged into the mod jar.
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // In-game smoke test harness (runSmokeClient / runSmokeServer, see TESTING.md): loader-neutral scenarios from
    // ../common/src/smoketest, the Sophisticated Backpacks fixture from ../common/src/smoketestBackpacks and the Fabric
    // glue from src/smoketest. Own fabric.mod.json (mod "sophisticatedbuilding_smoketest"); only loaded by the smoke
    // runs, never packaged into the mod jar.
    smoketest {
        java.srcDirs "${commonDir}/src/smoketest/java", "${commonDir}/src/smoketestBackpacks/java"
        resources.srcDirs "${commonDir}/src/smoketest/resources", "${commonDir}/src/smoketestBackpacks/resources"
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // Empty source set of the clientExported run: Minecraft and Fabric Loader only, so every mod (this one included)
    // comes from run-exported/mods. This project, its remapped mod dependencies (resolved lazily, Loom creates that
    // configuration later) and the dev-only libraries are left out.
    exportedStub {
        def excluded = main.output + files({ configurations.modRuntimeClasspathMainMapped }) + configurations.localRuntime
        runtimeClasspath = main.runtimeClasspath.filter { file -> file.name.startsWith('fabric-loader-') || !excluded.contains(file) }
    }
}

// mod* configurations (remapped) for the smoke source set, e.g. modSmoketestRuntimeOnly; before the dependencies
loom {
    createRemapConfigurations(sourceSets.smoketest)
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://www.cursemaven.com'
            }
        }
        filter { includeGroup('curse.maven') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    // Cardinal Components (Trinkets comes from Modrinth: 3.4.2 is not on the TerraformersMC maven), only in the smoke
    // runs (worn backpack in a Trinkets slot, sb.worn_backpack)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Ladysnake'
                url = 'https://maven.ladysnake.org/releases'
            }
        }
        filter { includeGroup('dev.onyxstudios.cardinal-components-api') }
    }
    mavenCentral()
}

// The Sophisticated Core and Backpacks jars nest (META-INF/jars) the Porting Lib modules they were built with
// (2.1.1305+1.19.2), Forge Config API Port, MixinExtras and Team Reborn Energy. Their types are part of the public API
// and both need them at runtime, but Loom does not expose a dependency's nested jars, so they are extracted from the
// resolved jars into build/sophisticatedcore-nested, one jar per mod id (a module nested at several levels or in both
// jars is extracted once).
def extractNestedJars
extractNestedJars = { File jar, File into, Map<String, File> found ->
    new java.util.zip.ZipFile(jar).withCloseable { zip ->
        zip.entries().toList().findAll { !it.directory && it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }.each { entry ->
            def target = new File(into, entry.name.substring('META-INF/jars/'.length()))
            if (!target.isFile() || target.length() != entry.size) {
                into.mkdirs()
                zip.getInputStream(entry).withCloseable { java.nio.file.Files.copy(it, target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
            }
            def modId = new java.util.zip.ZipFile(target).withCloseable { nested ->
                nested.getInputStream(nested.getEntry('fabric.mod.json')).withCloseable { new groovy.json.JsonSlurper().parse(it, 'UTF-8').id }
            }
            if (!found.containsKey(modId)) {
                found.put(modId, target)
                extractNestedJars(target, into, found)
            }
        }
    }
    return found
}
// Resolved lazily, when Loom processes the mod dependencies: for old Minecraft versions Loom still adds the LWJGL
// upgrade repository while setting up Minecraft, which fails once a configuration was resolved during configuration.
def sophisticatedCoreNestedDir = layout.buildDirectory.dir('sophisticatedcore-nested').get().asFile
def sophisticatedCoreNestedJars = files({
    def found = [:]
    ["curse.maven:${sophisticatedcore_cf}", "curse.maven:${sophisticatedbackpacks_cf}"].each { coordinates ->
        def jar = configurations.detachedConfiguration(dependencies.create(coordinates)).singleFile
        extractNestedJars(jar, sophisticatedCoreNestedDir, found)
    }
    found.values().sort()
})

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Sophisticated Core/Backpacks: compiled against, and present in the dev runs so runClient/runServer start with
    // the backpack integration active. Optional for players.
    modCompileOnly "curse.maven:${sophisticatedcore_cf}"
    modCompileOnly "curse.maven:${sophisticatedbackpacks_cf}"
    modLocalRuntime "curse.maven:${sophisticatedcore_cf}"
    modLocalRuntime "curse.maven:${sophisticatedbackpacks_cf}"
    // The jars nested in Sophisticated Core and Backpacks (see above).
    modCompileOnly sophisticatedCoreNestedJars
    modLocalRuntime sophisticatedCoreNestedJars

    // Smoke test harness only: Trinkets (with its Cardinal Components) so a backpack can be worn in a Trinkets slot
    modSmoketestCompileOnly("maven.modrinth:trinkets:${trinkets_version}") { transitive = false }
    modSmoketestCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}") { transitive = false }
    // Not transitive: the Cardinal Components POM drags in an old Fabric Loader/API. Loom drops the jars it nests, so Cardinal Components
    // (base, entity) are declared on their own.
    modSmoketestRuntimeOnly("maven.modrinth:trinkets:${trinkets_version}") { transitive = false }
    ['base', 'entity'].each { cca ->
        modSmoketestRuntimeOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-${cca}:${cardinal_components_version}") { transitive = false }
    }

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    // Keep the dev Minecraft jar free of the interfaces other mods inject (Fabric API, Sophisticated Core): the code
    // does not use them, and without them the clientExported run works with whatever set of mods is in its folder.
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    // RenderType.create and RenderType.CompositeState for the render types, see the file
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    runs {
        client {
            client()
        }
        server {
            server()
            vmArgs '-Dfabric.log.level=debug'
        }
        // Client that loads only the jars in run-exported/mods (production jars, e.g. an exported build of this mod,
        // Fabric API and Sophisticated Backpacks/Core); nothing from this project or its dev dependencies.
        clientExported {
            client()
            configName = 'Minecraft Client (exported jars)'
            runDir 'run-exported'
            source sourceSets.exportedStub
        }
        // Headless game test server: runs every @GameTest of src/gametest, writes a JUnit report and
        // exits non-zero if a required test fails. Run with: gradlew runGametest (not part of build).
        gametest {
            server()
            configName = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/junit.xml').get().asFile}"
            runDir 'build/gametest'
            source sourceSets.gametest
        }
        // Smoke test harness (see TESTING.md): a real client creates a fresh superflat world, runs the client
        // scenarios, writes <smoketestOut>/smoketest-result.json and exits. gradlew runSmokeClient -PsmoketestOut=<dir>
        smokeClient {
            client()
            configName = 'Smoke Test Client'
            runDir 'build/smoketest/client-run'
            source sourceSets.smoketest
            vmArg '-Dsophisticatedbuilding.smoketest.mode=client'
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('client')}"
        }
        // Headless: a game test server runs the server scenarios (fake survival players, real backpacks) and writes
        // the same JSON. gradlew runSmokeServer -PsmoketestOut=<dir>
        smokeServer {
            server()
            configName = 'Smoke Test Server'
            runDir 'build/smoketest/server-run'
            source sourceSets.smoketest
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dsophisticatedbuilding.smoketest.mode=server'
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('server')}"
        }
    }
}

// The smoke runs pass or fail on the result file they write (shared logic in ../gradle/smoketest.gradle)
tasks.named('runSmokeClient') { verifySmokeRun(it, smoketestOutDir('client')) }
tasks.named('runSmokeServer') { verifySmokeRun(it, smoketestOutDir('server')) }
// Trinkets 3.7.2, the last one for 1.20.1, was built with Loom 0.11: its client mixin ClickableWidgetMixin shadows
// AbstractWidget's field by its Yarn name ("hovered"), which a Mojang-mapped dev client cannot resolve (the client
// crashes at startup; players run the intermediary jar and are not affected). So the client smoke run leaves Trinkets
// and its Cardinal Components out and reports sb.worn_backpack as skipped; runSmokeServer covers it with Trinkets.
tasks.named('runSmokeClient', JavaExec) {
    classpath = classpath.filter { file -> !file.name.startsWith('trinkets') && !file.name.startsWith('cardinal-components') }
}

// fabric.mod.json takes a version predicate, not the Maven range of shared.properties:
// [1.19,1.19.2] -> ">=1.19 <=1.19.2", [1.19.2] -> "1.19.2"
def fabricVersionPredicate = { String range ->
    def single = range =~ /^\[([^,\]]+)\]$/
    if (single.matches()) return single.group(1)
    def closed = range =~ /^\[([^,\]]+),([^,\]]+)\]$/
    if (closed.matches()) return ">=${closed.group(1)} <=${closed.group(2)}"
    throw new GradleException("minecraft_version_range ${range} has no fabric.mod.json equivalent here")
}

processResources {
    var expandProps = [
            version                  : project.version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_description          : mod_description,
            mod_authors              : mod_authors,
            mod_license              : mod_license,
            minecraft_dependency     : fabricVersionPredicate(minecraft_version_range),
            fabric_loader_version_min: fabric_loader_version_min,
            fabric_api_version_min   : fabric_api_version_min,
            java_version             : java_version
    ]
    inputs.properties expandProps
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the game tests and the smoke harness (so they cannot rot) but never runs them; that is the job of
// runGametest and runSmokeClient / runSmokeServer.
tasks.named('check') {
    dependsOn tasks.named('gametestClasses'), tasks.named('smoketestClasses'), tasks.named('checkCommonIsLoaderNeutral')
}

// Resolved while configuring: the configuration cache cannot read project properties at execution time.
def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
