plugins {
    id 'fabric-loom' version '1.17.21'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    // Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-world tests of the server-side building rules (Fabric GameTest). Own fabric.mod.json with a
    // "fabric-gametest" entrypoint; only loaded by the gametest run, never packaged into the mod jar.
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // Empty source set of the clientExported run: Minecraft and Fabric Loader only, so every mod (this one included)
    // comes from run-exported/mods. This project, its remapped mod dependencies (resolved lazily, Loom creates that
    // configuration later) and the dev-only libraries are left out.
    exportedStub {
        def excluded = main.output + files({ configurations.modRuntimeClasspathMainMapped }) + configurations.localRuntime
        runtimeClasspath = main.runtimeClasspath.filter { file -> file.name.startsWith('fabric-loader-') || !excluded.contains(file) }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://www.cursemaven.com'
            }
        }
        filter { includeGroup('curse.maven') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    mavenCentral()
}

// The Sophisticated Core jar nests (META-INF/jars) the Porting Lib modules it was built with (2.3.2+1.20.1),
// MixinExtras and Team Reborn Energy. Their types are part of Core's public API and Core needs them at runtime, but
// Loom does not expose a dependency's nested jars, so they are extracted from the resolved Core jar into
// build/sophisticatedcore-nested, one jar per mod id (a module nested at several levels is extracted once).
def extractNestedJars
extractNestedJars = { File jar, File into, Map<String, File> found ->
    new java.util.zip.ZipFile(jar).withCloseable { zip ->
        zip.entries().toList().findAll { !it.directory && it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }.each { entry ->
            def target = new File(into, entry.name.substring('META-INF/jars/'.length()))
            if (!target.isFile() || target.length() != entry.size) {
                into.mkdirs()
                zip.getInputStream(entry).withCloseable { java.nio.file.Files.copy(it, target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
            }
            def modId = new java.util.zip.ZipFile(target).withCloseable { nested ->
                nested.getInputStream(nested.getEntry('fabric.mod.json')).withCloseable { new groovy.json.JsonSlurper().parse(it, 'UTF-8').id }
            }
            if (!found.containsKey(modId)) {
                found.put(modId, target)
                extractNestedJars(target, into, found)
            }
        }
    }
    return found
}
// Resolved lazily, when Loom processes the mod dependencies: for Minecraft 1.20.1 Loom still adds the LWJGL upgrade
// repository while setting up Minecraft, which fails once a configuration was resolved during configuration.
def sophisticatedCoreNestedDir = layout.buildDirectory.dir('sophisticatedcore-nested').get().asFile
def sophisticatedCoreNestedJars = files({
    def sophisticatedCoreJar = configurations.detachedConfiguration(dependencies.create("curse.maven:${sophisticatedcore_cf}")).singleFile
    extractNestedJars(sophisticatedCoreJar, sophisticatedCoreNestedDir, [:]).values().sort()
})

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Sophisticated Core/Backpacks: compiled against, and present in the dev runs so runClient/runServer start with
    // the backpack integration active. Optional for players.
    modCompileOnly "curse.maven:${sophisticatedcore_cf}"
    modCompileOnly "curse.maven:${sophisticatedbackpacks_cf}"
    modLocalRuntime "curse.maven:${sophisticatedcore_cf}"
    modLocalRuntime "curse.maven:${sophisticatedbackpacks_cf}"
    // The jars nested in Sophisticated Core (see above).
    modCompileOnly sophisticatedCoreNestedJars
    modLocalRuntime sophisticatedCoreNestedJars
    // Required by Core and Backpacks at runtime; the 1.20.1 Core jar does not nest it.
    modLocalRuntime "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}"

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

loom {
    // Keep the dev Minecraft jar free of the interfaces other mods inject (Fabric API, Sophisticated Core): the code
    // does not use them, and without them the clientExported run works with whatever set of mods is in its folder.
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
        }
        server {
            server()
            vmArgs '-Dfabric.log.level=debug'
        }
        // Client that loads only the jars in run-exported/mods (production jars, e.g. an exported build of this mod,
        // Fabric API and Sophisticated Backpacks/Core); nothing from this project or its dev dependencies.
        clientExported {
            client()
            configName = 'Minecraft Client (exported jars)'
            runDir 'run-exported'
            source sourceSets.exportedStub
        }
        // Headless game test server: runs every @GameTest of src/gametest, writes a JUnit report and
        // exits non-zero if a required test fails. Run with: gradlew runGametest (not part of build).
        gametest {
            server()
            configName = 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest/junit.xml').get().asFile}"
            runDir 'build/gametest'
            source sourceSets.gametest
        }
    }
}

processResources {
    var expandProps = [
            version                  : project.version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_description          : mod_description,
            mod_authors              : mod_authors,
            mod_license              : mod_license,
            minecraft_version        : minecraft_version,
            fabric_loader_version_min: fabric_loader_version_min,
            java_version             : java_version
    ]
    inputs.properties expandProps
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the game tests (so they cannot rot) but never runs them; that is runGametest's job.
tasks.named('check') {
    dependsOn tasks.named('gametestClasses'), tasks.named('checkCommonIsLoaderNeutral')
}

// Resolved while configuring: the configuration cache cannot read project properties at execution time.
def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
