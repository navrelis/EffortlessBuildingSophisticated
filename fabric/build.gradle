plugins {
    id 'fabric-loom' version '1.17.21'
    id 'java-library'
    id 'idea'
}

apply from: '../gradle/smoketest.gradle'

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    // Minecraft 1.16.3 runs on Java 8 (Mojang ships Java 8 with it), so mods target Java 8.
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

// The loader-neutral code and assets in ../common are compiled and packaged into this jar.
def commonDir = file('../common')

sourceSets {
    main {
        java.srcDir "${commonDir}/src/main/java"
        resources.srcDir "${commonDir}/src/main/resources"
    }
    test {
        java.srcDir "${commonDir}/src/test/java"
    }
    // In-game smoke test harness (runSmokeClient / runSmokeServer, see TESTING.md): loader-neutral scenarios from
    // ../common/src/smoketest and the Fabric glue from src/smoketest. No Sophisticated Backpacks on Fabric 1.16.3, so no
    // backpack fixture (../common/src/smoketestBackpacks) and no Trinkets. Own fabric.mod.json (mod
    // "sophisticatedbuilding_smoketest"); only loaded by the smoke runs, never packaged into the mod jar.
    smoketest {
        java.srcDir "${commonDir}/src/smoketest/java"
        resources.srcDir "${commonDir}/src/smoketest/resources"
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
    // In-world tests of the server-side building rules. Fabric API 0.25 for 1.16.3 has no game test API, so they are
    // server tests run by the smoke harness' ServerTestRunner (../common/src/smoketest). Own fabric.mod.json listing the
    // test classes; only loaded by the gametest run, never packaged into the mod jar.
    gametest {
        compileClasspath += main.compileClasspath + main.output + smoketest.output
        runtimeClasspath += main.runtimeClasspath + main.output + smoketest.output
    }
    // Empty source set of the clientExported run: Minecraft and Fabric Loader only, so every mod (this one included)
    // comes from run-exported/mods. This project and its remapped mod dependencies (resolved lazily,
    // Loom creates that configuration later) are left out.
    exportedStub {
        def excluded = main.output + files({ configurations.modRuntimeClasspathMainMapped })
        runtimeClasspath = main.runtimeClasspath.filter { file -> file.name.startsWith('fabric-loader-') || !excluded.contains(file) }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Written by the gametest run (FabricServerTests), checked by runGametest
def gametestReport = project.layout.buildDirectory.file('gametest/junit.xml').get().asFile

loom {
    // Keep the dev Minecraft jar free of the interfaces other mods inject (Fabric API): the code
    // does not use them, and without them the clientExported run works with whatever set of mods is in its folder.
    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }
    // Opens what Minecraft 1.16.3 keeps private and common/ uses (see the file)
    accessWidenerPath = file('src/main/resources/sophisticatedbuilding.accesswidener')
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
        }
        server {
            server()
            vmArgs '-Dfabric.log.level=debug'
        }
        // Client that loads only the jars in run-exported/mods (production jars, e.g. an exported build of this mod
        // and Fabric API); nothing from this project or its dev dependencies.
        clientExported {
            client()
            configName = 'Minecraft Client (exported jars)'
            runDir 'run-exported'
            source sourceSets.exportedStub
        }
        // Headless dedicated server on a fresh superflat world that runs every @ServerTest of src/gametest, writes a
        // JUnit report and stops; the task fails unless every test passed. Run with: gradlew runGametest (not part of build).
        gametest {
            server()
            configName = 'Game Test'
            vmArg "-Dsophisticatedbuilding.gametest.report=${gametestReport}"
            runDir 'build/gametest'
            source sourceSets.gametest
        }
        // Smoke test harness (see TESTING.md): a real client creates a fresh superflat world, runs the client
        // scenarios, writes <smoketestOut>/smoketest-result.json and exits. gradlew runSmokeClient -PsmoketestOut=<dir>
        smokeClient {
            client()
            configName = 'Smoke Test Client'
            runDir 'build/smoketest/client-run'
            source sourceSets.smoketest
            vmArg '-Dsophisticatedbuilding.smoketest.mode=client'
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('client')}"
        }
        // Headless: a dedicated server on a fresh superflat world runs the server scenarios (fake survival players,
        // Minecraft 1.16.3 has no game test framework, see ServerTestRunner) and writes the same JSON.
        // gradlew runSmokeServer -PsmoketestOut=<dir>
        smokeServer {
            server()
            configName = 'Smoke Test Server'
            runDir 'build/smoketest/server-run'
            source sourceSets.smoketest
            vmArg '-Dsophisticatedbuilding.smoketest.mode=server'
            vmArg "-Dsophisticatedbuilding.smoketest.out=${smoketestOutDir('server')}"
        }
    }
}

// The smoke runs pass or fail on the result file they write (shared logic in ../gradle/smoketest.gradle)
tasks.named('runSmokeClient') { verifySmokeRun(it, smoketestOutDir('client')) }
tasks.named('runSmokeServer') { verifySmokeRun(it, smoketestOutDir('server')) }

// runSmokeServer and runGametest start plain dedicated servers: every run starts on a fresh superflat world (level type
// without namespace, the default layers: bedrock, 2 dirt, grass) on its own port (other dev servers may run at the same
// time: 25738/25739 here, 25737 in ../forge, 25731-25735 on mc/1.16.5), with the EULA of these dev-only servers
// accepted.
def prepareTestServer = { File dir, int port ->
    new File(dir, 'world').deleteDir()
    dir.mkdirs()
    new File(dir, 'server.properties').text = 'level-type=flat\n' + "server-port=${port}\n"
    new File(dir, 'eula.txt').text = 'eula=true\n'
}
def smokeServerDir = file('build/smoketest/server-run')
tasks.named('runSmokeServer') {
    doFirst { prepareTestServer(smokeServerDir, 25738) }
}
def gametestDir = file('build/gametest')
tasks.named('runGametest') {
    // The server stops itself after the last test; the watchdog of a hanging run
    timeout = java.time.Duration.ofMinutes(15)
    doFirst {
        gametestReport.delete()
        prepareTestServer(gametestDir, 25739)
    }
    doLast {
        if (!gametestReport.file) {
            throw new GradleException("The server tests wrote no report (${gametestReport}): the server did not start or crashed, see its log")
        }
        def suite = new groovy.xml.XmlSlurper().parse(gametestReport)
        int total = suite.@tests.toInteger()
        int failures = suite.@failures.toInteger()
        suite.testcase.each { tc -> logger.lifecycle("  ${tc.failure.size() ? 'FAIL' : 'PASS'} ${tc.@name}${tc.failure.size() ? ': ' + tc.failure.@message : ''}") }
        if (total == 0 || failures > 0) {
            throw new GradleException("${failures} of ${total} server tests failed (see ${gametestReport})")
        }
        logger.lifecycle("All ${total} required tests passed")
    }
}

// fabric.mod.json takes a version predicate, not the Maven range of shared.properties:
// [1.16.4,1.16.5] -> ">=1.16.4 <=1.16.5", [1.16.5] -> "1.16.5"
def fabricVersionPredicate = { String range ->
    def single = range =~ /^\[([^,\]]+)\]$/
    if (single.matches()) return single.group(1)
    def closed = range =~ /^\[([^,\]]+),([^,\]]+)\]$/
    if (closed.matches()) return ">=${closed.group(1)} <=${closed.group(2)}"
    throw new GradleException("minecraft_version_range ${range} has no fabric.mod.json equivalent here")
}

processResources {
    var expandProps = [
            version                  : project.version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_description          : mod_description,
            mod_authors              : mod_authors,
            mod_license              : mod_license,
            minecraft_dependency     : fabricVersionPredicate(minecraft_version_range),
            fabric_loader_version_min: fabric_loader_version_min,
            fabric_api_version_min   : fabric_api_version_min,
            java_version             : java_version
    ]
    inputs.properties expandProps
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand expandProps
    }
    // The Building Upgrade recipes need Sophisticated Backpacks, which Fabric 1.16.3 does not have; Fabric API 0.25 has no
    // resource conditions to skip them (the other branches use fabric:load_conditions), so they are left out of the jar
    exclude 'data/sophisticatedbuilding/recipes/building_upgrade_*.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // No options.release: the Java 8 toolchain compiles with JDK 8's javac, which has no --release flag (JDK 9+).
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// ../common must stay loader-neutral: loader APIs are only reached through the platform services.
tasks.register('checkCommonIsLoaderNeutral') {
    def sources = fileTree("${commonDir}/src/main/java") { include '**/*.java' }
    inputs.files sources
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?(net\.fabricmc|net\.neoforged|net\.minecraftforge|net\.p3pp3rf1y|net\.createmod|dev\.engine_room)\./
        def offenders = sources.files.collectMany { file ->
            file.readLines('UTF-8').findAll { it =~ forbidden }.collect { "${file.path}: ${it.trim()}" }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("common/ must not import loader or optional-mod APIs:\n" + offenders.join('\n'))
        }
    }
}

// build compiles the game tests and the smoke harness (so they cannot rot) but never runs them; that is the job of
// runGametest and runSmokeClient / runSmokeServer.
tasks.named('check') {
    dependsOn tasks.named('gametestClasses'), tasks.named('smoketestClasses'), tasks.named('checkCommonIsLoaderNeutral')
}

// Resolved while configuring: the configuration cache cannot read project properties at execution time.
def licenseFileName = "LICENSE_${mod_id}.txt"
tasks.named('jar', Jar) {
    from(file('../LICENSE.txt')) {
        rename { licenseFileName }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
