# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on for Minecraft 1.19.2 (the loader the dev runs use), not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
fabric_api_version=0.77.0+1.19.2

# Sophisticated Core/Backpacks, unofficial Fabric ports for MC 1.19.2 (Salandora, CurseForge-only releases; their
# last 1.19.2 builds), resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>".
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core-unofficial-fabric-port (979317)
#            file 5803819 = sophisticatedcore-1.19.2-0.6.4.30.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks-unofficial-fabric-port (979322)
#            file 5803830 = sophisticatedbackpacks-1.19.2-3.20.2.22.jar
# Both nest what they need at runtime (Porting Lib 2.1.1305 modules, Forge Config API Port 4.2.11, MixinExtras, Team
# Reborn Energy); see build.gradle.
sophisticatedcore_cf=sophisticated-core-unofficial-fabric-port-979317:5803819
sophisticatedbackpacks_cf=sophisticated-backpacks-unofficial-fabric-port-979322:5803830
# Trinkets (TerraformersMC maven, its Cardinal Components from the Ladysnake maven), only in the smoke test runs: sb.worn_backpack wears the backpack in its chest/back slot.
# 3.4.2 is the last Trinkets for 1.19.2; it nests Cardinal Components 5.0.x (group dev.onyxstudios), 5.0.2 is the last one.
trinkets_version=3.4.2
cardinal_components_version=5.0.2
ci_gradle_jdk=21
