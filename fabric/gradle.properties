# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on for Minecraft 1.20.1 (the loader the dev runs use), not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
fabric_api_version=0.92.12+1.20.1
# Minimum Fabric API declared in fabric.mod.json's "depends": the version this code compiles and runs against
# (fabric_api_version), not an assumption about the lowest that would work.
fabric_api_version_min=0.92.12

# Sophisticated Core/Backpacks, unofficial Fabric ports for MC 1.20.1 (Salandora, CurseForge-only releases; their
# last 1.20.1 builds), resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>".
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core-unofficial-fabric-port (979317)
#            file 7341057 = sophisticatedcore-1.20.1-1.2.7.15.166.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks-unofficial-fabric-port (979322)
#            file 7147929 = sophisticatedbackpacks-1.20.1-3.23.4.5.110.jar
sophisticatedcore_cf=sophisticated-core-unofficial-fabric-port-979317:7341057
sophisticatedbackpacks_cf=sophisticated-backpacks-unofficial-fabric-port-979322:7147929
# Forge Config API Port, required by both at runtime; unlike their 1.20.4 builds, Core 1.20.1 does not nest it.
# Dev runtime only, from the Modrinth maven: https://modrinth.com/mod/forge-config-api-port (latest for 1.20.1)
forgeconfigapiport_version=v8.0.3-1.20.1-Fabric
# Trinkets (TerraformersMC maven, its Cardinal Components from the Ladysnake maven), only in the smoke test runs: sb.worn_backpack wears the backpack in its chest/back slot.
# 3.7.2 is the last Trinkets for 1.20.1; it nests Cardinal Components 5.2.x (group dev.onyxstudios, renamed org.ladysnake in 6.x), 5.2.2 is the last one.
trinkets_version=3.7.2
cardinal_components_version=5.2.2
ci_gradle_jdk=21
