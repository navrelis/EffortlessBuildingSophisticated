# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on for Minecraft 1.19.4 (the loader the dev runs use), not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
# Fabric API 0.87.2+1.19.4 is the last Fabric API for 1.19.4 and the one Sophisticated Backpacks/Core 1.19.4 require.
# fabric_api_version_min is the Fabric API floor in fabric.mod.json (mod id "fabric-api"): the version this code was
# compiled against and run on.
fabric_api_version=0.87.2+1.19.4
fabric_api_version_min=0.87.2

# Sophisticated Core/Backpacks, unofficial Fabric ports for MC 1.19.4 (Salandora, CurseForge-only; 1.19.4 has BETA
# files only, these are the newest matching pair, both "build.105"), resolved through CurseMaven as
# "curse.maven:<slug>-<projectId>:<fileId>".
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core-unofficial-fabric-port (979317)
#            file 5450726 = sophisticatedcore-0.5.109+mc1.19.4-SNAPSHOT-build.105.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks-unofficial-fabric-port (979322)
#            file 5450746 = sophisticatedbackpacks-3.19.5+mc1.19.4-SNAPSHOT-build.105.jar
# Both nest what they need at runtime (Porting Lib 2.1.2+1.19.4 modules, Forge Config API Port 6.0.2, MixinExtras, Team
# Reborn Energy, Cardinal Components); see build.gradle.
sophisticatedcore_cf=sophisticated-core-unofficial-fabric-port-979317:5450726
sophisticatedbackpacks_cf=sophisticated-backpacks-unofficial-fabric-port-979322:5450746
# Trinkets (Modrinth maven), its Cardinal Components from the Ladysnake maven, only in the smoke test runs:
# sb.worn_backpack wears the backpack in its chest/back slot. 3.6.0 is the Trinkets release for 1.19.4.
trinkets_version=3.6.0
cardinal_components_version=5.2.0
ci_gradle_jdk=21
# Common Protection API (Patbox, maven.nucleoid.xyz): 1.0.0 takes a GameProfile (Minecraft 1.19-1.21.x); compile-only
# for the mod, in the GameTests to check that its providers are asked
common_protection_api_version=1.0.0
