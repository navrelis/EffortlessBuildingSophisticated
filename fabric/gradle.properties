# The JDK CI uses to RUN Gradle itself (independent of the compile toolchain, which foojay auto-provisions via
# settings.gradle). Read by .github/workflows/build.yml; defaults to 21 if this key is absent.
ci_gradle_jdk=21

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on (4.2.1 and the F1 refactor both ran on it), not an assumption about the lowest that would work.
fabric_loader_version_min=0.18.6
fabric_api_version=0.116.17+1.21.1

# Sophisticated Core/Backpacks, unofficial Fabric ports for MC 1.21.1 (Salandora, CurseForge-only releases),
# resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>".
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core-unofficial-fabric-port (979317)
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks-unofficial-fabric-port (979322)
sophisticatedcore_cf=sophisticated-core-unofficial-fabric-port-979317:7344653
sophisticatedbackpacks_cf=sophisticated-backpacks-unofficial-fabric-port-979322:6844426
# Porting Lib modules the Core jar nests (META-INF/jars): their types are part of Core's public API and Core needs
# them at runtime. Loom does not expose a CurseMaven jar's nested jars, so they are resolved separately from the
# Fabricators of Create maven at exactly the nested version.
porting_lib_version=3.1.0-beta.47+1.21.1
# Further runtime dependencies of the Core build (its fabric.mod.json "depends"), for the dev runs only.
forgeconfigapiport_version=21.1.3
team_reborn_energy_version=4.1.0
# Night Config, required by Forge Config API Port (its POM dependency).
night_config_version=3.8.0
