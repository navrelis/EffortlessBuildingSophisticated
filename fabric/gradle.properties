# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on for Minecraft 1.20.4 (the loader the dev runs use), not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
fabric_api_version=0.97.3+1.20.4

# Sophisticated Core/Backpacks, unofficial Fabric ports for MC 1.20.4 (Salandora, CurseForge-only releases),
# resolved through CurseMaven as "curse.maven:<slug>-<projectId>:<fileId>".
# Core:      https://www.curseforge.com/minecraft/mc-mods/sophisticated-core-unofficial-fabric-port (979317)
#            file 6448724 = sophisticatedcore-1.20.4-0.6.27.138.jar
# Backpacks: https://www.curseforge.com/minecraft/mc-mods/sophisticated-backpacks-unofficial-fabric-port (979322)
#            file 6522961 = sophisticatedbackpacks-1.20.4-3.20.7.101.jar
sophisticatedcore_cf=sophisticated-core-unofficial-fabric-port-979317:6448724
sophisticatedbackpacks_cf=sophisticated-backpacks-unofficial-fabric-port-979322:6522961
# Trinkets (TerraformersMC maven, its Cardinal Components from the Ladysnake maven), only in the smoke test runs: sb.worn_backpack wears the backpack in its chest/back slot.
# 3.8.1 is the last Trinkets for 1.20.4; it uses Cardinal Components 5.4.0 (group dev.onyxstudios, renamed org.ladysnake in 6.x).
trinkets_version=3.8.1
cardinal_components_version=5.4.0
ci_gradle_jdk=21
