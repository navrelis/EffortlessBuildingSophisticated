# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on for Minecraft 1.16.5 (the loader the dev runs use), not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
# Fabric API 0.42.0+1.16 is the last Fabric API for 1.16.5 (it declares Minecraft ~1.16.2; also run on 1.16.4).
# fabric_api_version_min is the Fabric API floor in fabric.mod.json: the version this code was compiled against and run
# on, on 1.16.4 and 1.16.5. Fabric API for 1.16.x has the mod id "fabric" (renamed to "fabric-api" in later
# releases), so fabric.mod.json depends on "fabric".
fabric_api_version=0.42.0+1.16
fabric_api_version_min=0.42.0

# No Sophisticated Backpacks for Fabric 1.16.5 (the unofficial Fabric port starts at 1.19.2): this build ships no
# backpack integration, and the Sophisticated Building Upgrade items stay placeholders.
ci_gradle_jdk=21
