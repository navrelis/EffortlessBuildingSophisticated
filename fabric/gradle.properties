# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on, not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
fabric_api_version=0.161.0+26.2
# Minimum Fabric API declared in fabric.mod.json's "depends": the version this code compiles and runs against
# (fabric_api_version), not an assumption about the lowest that would work.
fabric_api_version_min=0.161.0

# Sophisticated Backpacks/Core have no Fabric build for MC 26.2, so this build has no backpack integration and no
# Sophisticated dependencies (the Building Upgrades are placeholder items, see FabricBootstrap).
ci_gradle_jdk=25
