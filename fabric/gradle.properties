# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom does not support the configuration cache.
org.gradle.configuration-cache=false

# Shared mod metadata and the Minecraft version: ../gradle/shared.properties

# Fabric toolchain
fabric_loader_version=0.19.5
# Minimum fabricloader declared in fabric.mod.json's "depends". This is the oldest version this code was
# run on for Minecraft 1.17.1 (the loader the dev runs use), not an assumption about the lowest that would work.
fabric_loader_version_min=0.19.5
# Fabric API 0.46.1+1.17 is the last Fabric API for 1.17.1. fabric_api_version_min is the "fabric-api" floor in
# fabric.mod.json: the version this code was compiled against and run on.
fabric_api_version=0.46.1+1.17
fabric_api_version_min=0.46.1

# No Sophisticated Backpacks for Fabric 1.17.1 (the unofficial Fabric port starts at 1.19.2): this build ships no
# backpack integration, and the Sophisticated Building Upgrade items stay placeholders.
ci_gradle_jdk=21
