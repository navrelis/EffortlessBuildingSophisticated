# Values shared by every loader build of this branch (fabric/, neoforge/, ...). Each loader's settings.gradle loads
# this file and exposes the values as project properties, so they are defined exactly once. Loader-specific versions
# live in <loader>/gradle.properties.

# Mod metadata
# The unique mod identifier. Must match SophisticatedBuilding.MODID.
mod_id=sophisticatedbuilding
mod_name=Sophisticated Building
mod_version=5.0.1
# Maven group; matches the base package of the sources.
mod_group=sophisticated.building
mod_license=LGPL-3.0-only
mod_authors=Requioss, Navrelis
mod_description=Advanced building tools with mirror, array, and shape-based placement modes.\nBased on Effortless Building.

# Minecraft
minecraft_version=1.16.5
# One Fabric jar covers 1.16.4 and 1.16.5 (smoke-tested on 1.16.4, see TESTING.md). Forge overrides it with
# forge_minecraft_version_range: the 1.16.5 Forge jar needs Forge 36 and Sophisticated Backpacks 1.16.5, forge-1.16.4/
# builds the Forge jar for 1.16.4.
minecraft_version_range=[1.16.4,1.16.5]
java_version=8
